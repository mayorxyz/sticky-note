<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Paper Annotate — press PDFs and Markdown onto a paper desk and argue with them in highlights and handwritten notes. Local-only." />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='3' width='22' height='26' rx='2' fill='%23f4ecd8' stroke='%232b2620' stroke-width='1.6'/%3E%3Cpath d='M9 11h12M9 16h12M9 21h7' stroke='%238d8069' stroke-width='1.8' stroke-linecap='round'/%3E%3Crect x='15' y='17' width='14' height='12' rx='1' fill='%23fdf6a9' stroke='%23b7a94e' transform='rotate(-8 15 17)'/%3E%3C/svg%3E"
    />
    <title>Paper Annotate — a desk for close reading</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      /* Apply the saved paper tone before first paint (settings.theme or legacy theme field). */
      (function () {
        var resolved = "light";
        try {
          var raw = localStorage.getItem("paper-annotate.docs.v1");
          if (raw) {
            var data = JSON.parse(raw);
            var t = (data.settings && data.settings.theme) || data.theme || "light";
            if (t === "system") {
              t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            }
            if (t === "dark" || t === "black" || t === "light") resolved = t;
            if (data.settings && data.settings.reduceMotion) {
              document.documentElement.classList.add("reduce-motion");
            }
          }
        } catch (e) {}
        document.documentElement.classList.toggle("dark", resolved === "dark");
        document.documentElement.classList.toggle("black", resolved === "black");
        document.documentElement.setAttribute("data-theme", resolved);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
