<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Paper Annotate — read PDFs and Markdown on a textured paper desk, mark them up with highlights and handwritten sticky notes. Everything stays in your browser." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23a33d2a'/%3E%3Cpath d='M9 24.5 20.5 8l4 3L13 27.5 8.2 28.6z' fill='%23f4ecd8'/%3E%3Ccircle cx='22.5' cy='10' r='1.6' fill='%23f4ecd8'/%3E%3C/svg%3E" />
    <title>Paper Annotate — margins, marks &amp; sticky notes</title>
    <script>
      // Apply the saved paper tone before first paint so the desk never flashes.
      (function () {
        try {
          var raw = localStorage.getItem("paper-annotate.docs.v1");
          var theme = raw ? (JSON.parse(raw) || {}).theme : null;
          var dark = theme === "dark" || (!theme && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) { /* keep light */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
